name: Ejecutar Sistema de Metraje

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar TODAS las librerías
        run: |
          pip install streamlit pandas streamlit-gsheets-connection st-gsheets-connection gspread google-auth

      - name: Ejecutar Aplicación
        env:
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
        run: python app.py
