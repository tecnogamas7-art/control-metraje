name: Ejecutar Script de Google
on:
  push:
    branches: [ main ]  # Se ejecuta cada vez que subas cambios
  workflow_dispatch:      # Permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install gspread google-auth

      - name: Ejecutar el script
        env:
          # AQUÍ CONECTAMOS TU SECRETO CON EL CÓDIGO
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python app.py  # Cambia 'mi_script.py' por el nombre de tu archivo
