name: Ejecutar Sistema de Metraje

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ejecutar_proceso:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Versión estable para estas librerías

      - name: Instalar y Correr Todo
        env:
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
        run: |
          python -m pip install --upgrade pip
          # Instalamos solo las librerías necesarias y correctas
          pip install streamlit pandas st-gsheets-connection gspread google-auth
          python app.py
