name: Ejecutar Sistema de Metraje

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Esto te permite darle al botón "Run" manualmente en GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install pandas streamlit-gsheets-connection st-gsheets-connection gspread google-auth

      - name: Ejecutar Aplicación
        env:
          # SOLO LOS 3 SECRETOS QUE REALMENTE TIENES EN GITHUB
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
        run: python app.py
